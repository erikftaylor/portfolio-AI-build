    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Boot guard: stale cached HTML references hashed bundles a newer deploy
         deleted; the SPA fallback serves them as HTML and the entry script dies
         on "Unexpected token '<'", leaving a static page with no hydration.
         Reload once with a cache-busting query. -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('boot-reload-once')) return
          addEventListener('error', function (e) {
            var msg = (e && e.message) || ''
            if (msg.indexOf("Unexpected token '<'") === -1) return
            try { sessionStorage.setItem('boot-reload-once', '1') } catch (_) { return }
            location.replace(location.pathname + '?r=' + Date.now())
          }, true)
        } catch (_) { /* storage denied — no guard, no loop risk */ }
      })()
    </script>

    <!-- Structured Data (JSON-LD)
         Only assert what is TRUE and VERIFIABLE. Every `sameAs` must resolve;
         every credential must have a real verification URL. Fabricated or
         dead entries actively damage entity resolution in search and AI answers.
         Add `hasCredential`, `subjectOf` (press), and `worksFor` only when real. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://etaylor.co/#website",
          "url": "https://etaylor.co",
          "name": "Erik Taylor — Product Designer · AI × UX",
          "inLanguage": "en",
          "publisher": { "@id": "https://etaylor.co/#person" }
        },
        {
          "@type": "ProfilePage",
          "@id": "https://etaylor.co/#profilepage",
          "url": "https://etaylor.co",
          "mainEntity": { "@id": "https://etaylor.co/#person" }
        },
        {
          "@type": "Person",
          "@id": "https://etaylor.co/#person",
          "name": "Erik Taylor",
          "alternateName": ["Erik F. Taylor"],
          "url": "https://etaylor.co",
          "image": "https://etaylor.co/foto-avatar.png",
          "email": "erik@etaylor.co",
          "description": "Denver-based product designer, in design since 2016 and in tech since 2008, across global enterprise at IBM, financial services at Transamerica, and SaaS at Tovuti LMS. Works upstream, at the intersection of AI and UX.",
          "jobTitle": ["Senior Product Designer", "Senior UX Designer", "AI Product Designer"],
          "knowsAbout": [
            "User Experience Design",
            "Product Design",
            "Design Systems",
            "UX Research",
            "Figma",
            "AI-Assisted Design Workflows",
            "Enterprise Software Design",
            "Design Handoff"
          ],
          "sameAs": [
            "https://github.com/erikftaylor",
            "https://www.linkedin.com/in/erikftaylor/",
            "https://x.com/erikftaylor",
            "https://www.instagram.com/erikftaylor/",
            "https://www.threads.net/@erikftaylor"
          ],
          "address": { "@type": "PostalAddress", "addressLocality": "Denver", "addressCountry": "US" }
        }
      ]
    }
    </script>
    <!-- Theme + palette detection before first paint (eliminates dark→light FOUC).
         Palette ids/classes must stay in sync with PALETTES in GlobalNav.tsx;
         'blueprint' is dark-only so it forces dark. -->
    <script>
      (function(){var s=localStorage.getItem('theme');var d=s?s==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;var h=document.documentElement;var p=localStorage.getItem('palette');if(p==='warm')h.classList.add('theme-warm');else if(p==='blueprint'){h.classList.add('theme-blueprint');d=true}h.classList.toggle('dark',d);h.classList.toggle('light',!d);var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=d?'dark':'light';var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#0a0a0a':'#ffffff'})()
    </script>
